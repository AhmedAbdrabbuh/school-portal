{% extends 'portal/base.html' %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-10 text-center mb-5">
        <h2 class="display-5 fw-bold text-success mb-3"><i class="bi bi-heart-fill text-danger me-2"></i>Support Our Cause</h2>
        <p class="lead text-muted">Your generous donations help us provide scholarships, improve school facilities, and fund extracurricular activities for students in need.</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-5">
                <form action="#" method="post">
                    <h4 class="mb-4 fw-bold border-bottom pb-2">Select Donation Amount</h4>

                    <div class="btn-group w-100 mb-4" role="group" aria-label="Donation amounts">
                        <input type="radio" class="btn-check" name="donation_amount" id="amt1" autocomplete="off" checked>
                        <label class="btn btn-outline-success fs-5" for="amt1">$25</label>

                        <input type="radio" class="btn-check" name="donation_amount" id="amt2" autocomplete="off">
                        <label class="btn btn-outline-success fs-5" for="amt2">$50</label>

                        <input type="radio" class="btn-check" name="donation_amount" id="amt3" autocomplete="off">
                        <label class="btn btn-outline-success fs-5" for="amt3">$100</label>

                        <input type="radio" class="btn-check" name="donation_amount" id="amt_custom" autocomplete="off">
                        <label class="btn btn-outline-success fs-5" for="amt_custom">Custom</label>
                    </div>

                    <div class="mb-4">
                        <label for="donor_name" class="form-label fw-bold">Full Name</label>
                        <input type="text" class="form-control form-control-lg" id="donor_name" placeholder="John Doe">
                    </div>

                    <div class="mb-4">
                        <label for="donor_email" class="form-label fw-bold">Email Address</label>
                        <input type="email" class="form-control form-control-lg" id="donor_email" placeholder="john@example.com">
                    </div>

                    <div class="d-grid">
                        <button type="button" class="btn btn-success btn-lg rounded-pill" onclick="alert('Thank you! (This is a demo button)')">
                            <i class="bi bi-gift me-2"></i>Donate Now
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
