{% extends 'portal/base.html' %}

{% block content %}
<div class="text-center mb-5">
    <i class="bi bi-images mb-3" style="font-size: 3rem; color: #c9a84c;"></i>
    <h2 class="fw-bold" style="color: #1a5c2a;">Gallery</h2>
    <p class="text-muted">Moments and memories from Al Madina School</p>
</div>

<div class="row g-4">
    {% for i in "123456789" %}
    <div class="col-6 col-md-4">
        <div class="rounded-3 d-flex align-items-center justify-content-center shadow-sm"
             style="height: 200px; background: linear-gradient(135deg, #e8f5ec, #c8e6c9); border: 1px solid #c8e6c9;">
            <div class="text-center">
                <i class="bi bi-image" style="font-size: 3rem; color: #2e7d46; opacity: 0.5;"></i>
                <p class="text-muted small mt-2 mb-0">Photo Coming Soon</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<div class="text-center mt-5">
    <p class="text-muted fst-italic small">Photos will be added soon, in sha Allah. Check back for updates.</p>
</div>
{% endblock %}
