{% extends 'portal/base.html' %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <i class="bi bi-shield-check text-success mb-3" style="font-size: 5rem;"></i>
        <h2 class="display-6 fw-bold">Successfully Logged Out</h2>
        <p class="lead text-muted mb-4">Thank you for visiting. Your session has been safely closed.</p>
        <a href="{% url 'login' %}" class="btn btn-outline-primary rounded-pill px-4 py-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> Log back in
        </a>
        <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4 py-2 ms-2">
            <i class="bi bi-house me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
